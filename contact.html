<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itzenix - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div id="branding">
                <h1><a href="index.html">Itzenix</a></h1>
            </div>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html" data-translate="Home">Home</a></li>
                    <li><a href="services.html" data-translate="Services">Services</a></li>
                    <li><a href="portfolio.html" data-translate="Portfolio">Portfolio</a></li>
                    <li><a href="about.html" data-translate="About Us">About Us</a></li>
                    <li class="current"><a href="contact.html" data-translate="Contact">Contact</a></li>
                </ul>
            </nav>
            <div class="header-right">
                <div class="search-container">
                    <input type="text" placeholder="Search...">
                    <button type="submit"><i class="fa fa-search"></i></button>
                </div>
                <div class="language-switcher">
                    <span>🌐 EN | हिन्दी</span>
                </div>
                <div class="theme-switcher">
                    <span>🌙</span>
                </div>
                <button class="hamburger" id="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <section>
                <h2 data-translate="Contact Us">Contact Us</h2>
                <div class="contact-form">
                    <form id="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
                        <input type="text" name="name" placeholder="Your Name" data-translate="Your Name" required>
                        <input type="email" name="email" placeholder="Your Email" data-translate="Your Email" required>
                        <input type="text" name="subject" placeholder="Subject" required>
                        <textarea name="message" placeholder="Your Message" data-translate="Your Message" required></textarea>
                        <button type="submit" class="cta-button" data-translate="Send Message">Send Message</button>
                    </form>
                    <p id="form-status"></p>
                </div>
            </section>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/65b1a6c18d261e1b5f58de8e/1hkvt3hgr';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    <!--End of Tawk.to Script-->
    <script src="script.js"></script>
    <script src="contact.js"></script>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
